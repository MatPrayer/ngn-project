<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netslice — network slicing in SDN</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --ink: #e6edf3;
    --dim: #8b949e; --accent: #58a6ff; --ok: #3fb950; --warn: #d29922;
    --bad: #f85149; --host: #a371f7;
  }
  * { box-sizing: border-box; }

  /* The whole thing is one screen: the page itself never scrolls, and any
     panel that outgrows its share scrolls inside its own box. Demoing on a
     projector, scrolling to find the flow table is the last thing you want. */
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
    display: flex; flex-direction: column;
  }
  header {
    flex: 0 0 auto;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .status { margin-left: auto; font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.up { background: var(--ok); } .dot.down { background: var(--bad); }

  main {
    flex: 1; min-height: 0;              /* min-height:0 or the grid refuses to shrink */
    display: grid; gap: 12px; padding: 12px;
    grid-template-columns: minmax(400px, 1fr) minmax(370px, 460px);
    grid-template-rows: minmax(0, 1fr);
  }

  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    display: flex; flex-direction: column; min-height: 0;
  }
  section > h2 {
    flex: 0 0 auto;
    margin: 0; padding: 8px 14px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
    border-bottom: 1px solid var(--line);
  }
  .body { padding: 12px 14px; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  /* Topology takes what is left after the event log; the log keeps a floor so
     it stays useful, and a ceiling so it never crowds out the map. */
  #topology { flex: 1 1 auto; }
  #topology .body { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 8px; }

  /* A link can be full (every Mbps reserved) or overbooked (more reserved than
     it physically has, which only happens with admission control switched off).
     Both would otherwise be plain red, and on a projector they must not look
     the same, so overbooked links get hazard stripes over the red. */
  .link.over { animation: march 0.6s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -14; } }
  .llabel.over { fill: #f0b72f; font-weight: 700; }

  .legend { flex: 0 0 auto; display: flex; gap: 14px; flex-wrap: wrap;
            padding: 8px 4px 0; font-size: 10.5px; color: var(--dim); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { display: inline-block; width: 17px; height: 3px; border-radius: 2px; }
  .legend .l-free { background: #2d5a3d; }
  .legend .l-ok { background: #3fb950; }
  .legend .l-busy { background: #d29922; }
  .legend .l-full { background: #f85149; }
  .legend .l-over { background: repeating-linear-gradient(90deg,
                    #f85149 0 4px, #f0b72f 4px 8px); }
  .legend .l-down { background: repeating-linear-gradient(90deg,
                    #f85149 0 5px, transparent 5px 9px); }
  #eventpanel { flex: 0 1 auto; max-height: 34%; min-height: 108px; }
  #formpanel { flex: 0 1 auto; }
  #formpanel .body { overflow-y: auto; }
  /* The flow table is the thing being demonstrated, so always leave some of it. */
  #flowpanel { flex: 1 1 auto; min-height: 150px; }

  svg { display: block; flex: 1; width: 100%; height: 100%; min-width: 0; min-height: 0; }
  .link { stroke-linecap: round; cursor: pointer; }
  .link.down { stroke-dasharray: 6 5; }
  .link.lit { stroke: var(--accent) !important; }
  .access { stroke: #30363d; stroke-width: 2; }
  .node { fill: #1f6feb; stroke: #0b3d91; }
  .node.off { fill: #3d444d; stroke: #21262d; }
  .hostnode { fill: #6e40c9; stroke: #4c2889; }
  .nlabel { fill: #fff; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .llabel { fill: var(--dim); font-size: 10px; text-anchor: middle; dominant-baseline: central; }
  .llabel.lit { fill: var(--accent); }

  form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--dim); }
  input, select, button {
    font: inherit; font-size: 13px; background: #0d1117; color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .wide { grid-column: 1 / -1; }
  .checks { display: flex; gap: 18px; font-size: 12px; color: var(--dim); }
  .checks label { flex-direction: row; align-items: center; gap: 6px; }
  button {
    background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #388bfd; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--dim); font-weight: 400; }
  button.ghost:hover { border-color: var(--bad); color: var(--bad); background: transparent; }
  button.tiny { padding: 2px 7px; font-size: 11px; }

  /* The outcome box carries two iperf3 command lines, which wrap. Cap it so a
     long reply cannot push the flow table off the screen. */
  .result {
    margin-top: 10px; padding: 9px 11px; border-radius: 5px; font-size: 12px;
    display: none; max-height: 136px; overflow-y: auto;
  }
  .result.show { display: block; }
  .result.ok { background: rgba(63,185,80,.1); border: 1px solid rgba(63,185,80,.4); }
  .result.err { background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.4); }
  .result code { display: block; margin-top: 6px; color: var(--dim); font-size: 11px; word-break: break-all; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--dim); font-weight: 500; font-size: 10px;
       text-transform: uppercase; letter-spacing: .06em; padding: 0 8px 6px; }
  td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: rgba(88,166,255,.07); }
  tbody tr.sel { background: rgba(88,166,255,.14); }
  .pill { padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; letter-spacing: .04em; }
  .ACTIVE { background: rgba(63,185,80,.16); color: var(--ok); }
  .FAILED { background: rgba(248,81,73,.16); color: var(--bad); }
  .EXPIRED, .REMOVED { background: rgba(139,148,158,.16); color: var(--dim); }
  .PREEMPTED { background: rgba(210,153,34,.16); color: var(--warn); }
  .muted { color: var(--dim); }
  .bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }

  #events { flex: 1; min-height: 0; overflow-y: auto; font-size: 11.5px; }
  /* overflow on both axes: nine columns in a narrow pane scroll sideways
     inside this box rather than spilling out of the layout. */
  #flows { flex: 1; min-height: 0; overflow: auto; }
  #flows table { min-width: 430px; }
  #flows thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; padding-top: 8px; }
  #result { flex: 0 0 auto; }
  .ev { padding: 4px 14px; border-bottom: 1px solid rgba(48,54,61,.5); display: flex; gap: 8px; }
  .ev .k { flex: 0 0 130px; font-weight: 600; }
  .ev .d { color: var(--dim); word-break: break-word; }
  .k-flow_admitted, .k-rerouted, .k-link_up { color: var(--ok); }
  .k-request_rejected, .k-reroute_failed, .k-link_down { color: var(--bad); }
  .k-preempted, .k-flow_expired { color: var(--warn); }
  .k-switch_up, .k-switch_down, .k-port_status, .k-flow_removed { color: var(--dim); }
  .empty { padding: 18px 14px; color: var(--dim); font-size: 12px; }

  /* Too narrow for two columns: stack them and let `main` scroll internally.
     One screen is not achievable here, but the page itself still never
     scrolls, so the header stays put. */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: none; overflow-y: auto; }
    #topology { min-height: 330px; }
    #eventpanel { max-height: none; min-height: 150px; }
    #flowpanel { min-height: 210px; }
  }

  /* Short viewport — a laptop panel, or a projector at 720p. Tighten the form
     rather than let it crowd out the flow table. */
  @media (max-height: 780px) {
    form { gap: 7px; }
    label { font-size: 10px; }
    input, select, button { padding: 4px 7px; font-size: 12px; }
    .body { padding: 9px 11px; }
    .result { max-height: 96px; }
    #eventpanel { max-height: 28%; }
  }
</style>
</head>
<body>

<header>
  <h1>netslice</h1>
  <span class="sub">network slicing in SDN — widest path, preemption, TTL, rerouting</span>
  <span class="status"><span id="dot" class="dot down"></span><span id="conn">connecting…</span></span>
</header>

<main>
  <div class="col">
    <section id="topology">
      <h2>Topology — residual capacity</h2>
      <div class="body">
        <svg id="map" viewBox="0 0 660 560" preserveAspectRatio="xMidYMid meet"
             role="img" aria-label="network topology"></svg>
        <div class="legend">
          <span><i class="l-free"></i>unused</span>
          <span><i class="l-ok"></i>&lt;50%</span>
          <span><i class="l-busy"></i>&lt;85%</span>
          <span><i class="l-full"></i>full</span>
          <span><i class="l-over"></i>overbooked</span>
          <span><i class="l-down"></i>down</span>
          <span style="margin-left:auto">labels show residual / capacity Mbps</span>
        </div>
      </div>
    </section>
    <section id="eventpanel">
      <h2>Event log</h2>
      <div id="events"><div class="empty">no events yet</div></div>
    </section>
  </div>

  <div class="col">
    <section id="formpanel">
      <h2>Request a flow</h2>
      <div class="body">
        <form id="req">
          <label>source<select name="src" id="src"></select></label>
          <label>destination<select name="dst" id="dst"></select></label>
          <label>bandwidth (Mbps)<input name="bandwidth_mbps" type="number" min="0.1" step="0.1" value="5"></label>
          <label>priority<input name="priority" type="number" min="0" step="1" value="1"></label>
          <label>idle timeout (s)<input name="idle_timeout" type="number" min="0" step="1" value="60"></label>
          <label>hard timeout (s, 0 = none)<input name="hard_timeout" type="number" min="0" step="1" value="0"></label>
          <label>path policy
            <select name="policy"><option value="widest">widest</option><option value="shortest">shortest</option></select>
          </label>
          <label>victim tie-break
            <select name="tie_break"><option value="fewest">fewest flows</option><option value="best_fit">least waste</option></select>
          </label>
          <div class="wide checks">
            <label><input type="checkbox" name="allow_preemption" checked> allow preemption</label>
            <label><input type="checkbox" name="admission_control" checked> admission control</label>
          </div>
          <button class="wide" type="submit">allocate</button>
        </form>
        <div id="result" class="result"></div>
      </div>
    </section>

    <section id="flowpanel">
      <h2>Flows <button id="clear" class="ghost tiny" style="float:right;margin-top:-2px">clear all</button></h2>
      <div id="flows"><div class="empty">no flows</div></div>
    </section>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";

let topo = null, place = {}, centre = { x: 330, y: 275 };
let selected = null, lastSeq = 0, everConnected = false;

const api = async (path, opts) => {
  const r = await fetch(path, opts);
  return r.json();
};

function el(name, attrs, text) {
  const node = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

/* ---------------------------------------------------------------- topology */

function layout() {
  const switches = Object.keys(topo.switches);
  const cx = centre.x, cy = centre.y, r = 185, hostR = 250;
  switches.forEach((s, i) => {
    // Start at the top and go clockwise, so s1 sits where the drawings in the
    // docs put it and the ring reads the same way on paper and on screen.
    const a = (i / switches.length) * 2 * Math.PI - Math.PI / 2;
    place[s] = { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    place["@" + s] = { x: cx + hostR * Math.cos(a), y: cy + hostR * Math.sin(a) };
  });
}

function isSwitch(n) { return topo.switches[n] !== undefined; }

function isOverbooked(link) {
  // A whole Mbps of tolerance would be wrong here: the point is that any
  // negative residual is a promise the network cannot keep.
  return link.residual_mbps < -1e-9 && !link.down;
}

function linkColour(link) {
  if (link.down) return "#f85149";
  const used = link.used_mbps / link.capacity_mbps;
  if (used <= 0.001) return "#2d5a3d";
  if (used < 0.5) return "#3fb950";
  if (used < 0.85) return "#d29922";
  return "#f85149";
}

/* Where to write each link's capacity label.
 *
 * The midpoint is the obvious answer and the wrong one here: the three chords
 * are diameters of the ring, so all three midpoints land on the same point and
 * the labels stack. Worse, that point is where the chords cross, which is the
 * busiest part of the picture.
 *
 * So: slide a label along its own link until it is clear of the ones already
 * placed, and never offer the midpoint to a link that runs through the middle.
 * Deterministic, and general enough to survive a change of topology.
 */
function labelPositions(coreLinks) {
  const MIN_GAP = 34;      // a label box is 54x16; this keeps them apart
  const HUB = 46;          // "passes through the middle" radius
  const positions = {};
  const taken = [];

  for (const link of coreLinks) {
    const a = place[link.a], b = place[link.b];
    const at = (t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    const mid = at(0.5);
    const throughHub = Math.hypot(mid.x - centre.x, mid.y - centre.y) < HUB;
    const candidates = throughHub ? [0.3, 0.7, 0.22, 0.78] : [0.5, 0.34, 0.66, 0.26];

    let chosen = null;
    for (const t of candidates) {
      const p = at(t);
      if (taken.every((q) => Math.hypot(p.x - q.x, p.y - q.y) >= MIN_GAP)) {
        chosen = p;
        break;
      }
    }
    chosen = chosen || at(candidates[0]);   // give up gracefully, never crash
    taken.push(chosen);
    positions[link.id] = chosen;
  }
  return positions;
}

function drawMap(state) {
  const svg = $("map");
  svg.textContent = "";
  const lit = new Set(selected && state.flowsById[selected] ? state.flowsById[selected].links : []);

  // Access links first, so they sit under everything else.
  for (const link of topo.links) {
    if (isSwitch(link.a) && isSwitch(link.b)) continue;
    const host = isSwitch(link.a) ? link.b : link.a;
    const sw = isSwitch(link.a) ? link.a : link.b;
    const h = place["@" + sw], s = place[sw];
    svg.appendChild(el("line", { x1: h.x, y1: h.y, x2: s.x, y2: s.y, class: "access" }));
    void host;
  }

  const coreLinks = topo.links.filter((l) => isSwitch(l.a) && isSwitch(l.b));
  const labelAt = labelPositions(coreLinks);

  for (const link of coreLinks) {
    const live = state.links[link.id] || { capacity_mbps: link.capacity_mbps, used_mbps: 0, down: false };
    const a = place[link.a], b = place[link.b];
    const on = lit.has(link.id);
    const width = on ? 6 : 2 + live.capacity_mbps / 7;
    svg.appendChild(el("line", {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      class: "link" + (live.down ? " down" : "") + (on ? " lit" : ""),
      stroke: linkColour(live),
      "stroke-width": width,
      "data-link": link.id,
    }));
    // Overbooked: more reserved than the link can carry, which only happens
    // with admission control switched off. Hazard stripes over the red, so it
    // cannot be mistaken for a link that is merely full.
    if (isOverbooked(live)) {
      svg.appendChild(el("line", {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        class: "link over", stroke: "#f0b72f",
        "stroke-width": width, "stroke-dasharray": "7 7",
      }));
    }
  }

  // Labels after every line, so none of them is drawn over.
  for (const link of coreLinks) {
    const live = state.links[link.id] || { capacity_mbps: link.capacity_mbps, used_mbps: 0, down: false };
    const on = lit.has(link.id);
    const over = isOverbooked(live);
    const p = labelAt[link.id];
    svg.appendChild(el("rect", {
      x: p.x - 27, y: p.y - 8, width: 54, height: 16, rx: 8, fill: "#0d1117", opacity: .9,
    }));
    svg.appendChild(el("text", {
      x: p.x, y: p.y, class: "llabel" + (on ? " lit" : "") + (over ? " over" : ""),
    }, live.down ? "DOWN" : `${(+live.residual_mbps).toFixed(1)}/${live.capacity_mbps}`));
  }

  for (const [host, info] of Object.entries(state.hosts)) {
    const p = place["@" + info.switch];
    svg.appendChild(el("circle", { cx: p.x, cy: p.y, r: 17, class: "hostnode" }));
    svg.appendChild(el("text", { x: p.x, y: p.y, class: "nlabel" }, host));
  }

  for (const [name, info] of Object.entries(state.switches)) {
    const p = place[name];
    svg.appendChild(el("circle", {
      cx: p.x, cy: p.y, r: 23, class: "node" + (info.connected ? "" : " off"),
    }));
    svg.appendChild(el("text", { x: p.x, y: p.y, class: "nlabel" }, name));
  }
}

/* ------------------------------------------------------------------- flows */

function drawFlows(state) {
  const box = $("flows");
  const flows = state.flows;
  if (!flows.length) { box.innerHTML = '<div class="empty">no flows</div>'; return; }

  const rows = flows.map((f) => {
    const ttl = f.remaining_hard_sec !== null && f.remaining_hard_sec !== undefined
      ? `${f.remaining_hard_sec}s hard`
      : (f.remaining_idle_sec !== null && f.remaining_idle_sec !== undefined
          ? `${f.remaining_idle_sec}s idle` : "—");
    const rate = f.throughput_mbps === null || f.throughput_mbps === undefined
      ? "—" : `${f.throughput_mbps.toFixed(2)}`;
    const pct = Math.min(100, (f.throughput_mbps || 0) / f.bandwidth_mbps * 100);
    return `<tr data-id="${f.flow_id}" class="${selected === f.flow_id ? "sel" : ""}">
      <td>${f.flow_id}</td>
      <td>${f.src}&rarr;${f.dst}<div class="muted">:${f.tp_dst}</div></td>
      <td>${f.path.length ? f.path.join("-") : '<span class="muted">—</span>'}</td>
      <td>${f.bandwidth_mbps}<div class="bar"><i style="width:${pct}%"></i></div></td>
      <td>${f.priority}</td>
      <td>${rate}</td>
      <td class="muted">${f.state === "ACTIVE" ? ttl : "—"}</td>
      <td><span class="pill ${f.state}">${f.state}</span></td>
      <td>${f.state === "ACTIVE"
            ? `<button class="ghost tiny" data-rm="${f.flow_id}">×</button>` : ""}</td>
    </tr>`;
  }).join("");

  box.innerHTML = `<table><thead><tr>
      <th>id</th><th>flow</th><th>path</th>
      <th title="reserved bandwidth in Mbps; the bar is how much of it the flow is using">reserved</th>
      <th title="priority class — higher preempts lower">pri</th>
      <th title="measured throughput in Mbps, from the switch flow counters">actual</th>
      <th title="time left before the flow expires">ttl</th>
      <th>state</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table>`;

  box.querySelectorAll("tbody tr").forEach((tr) => {
    tr.onclick = (e) => {
      if (e.target.dataset.rm) return;
      selected = selected === tr.dataset.id ? null : tr.dataset.id;
      refresh();
    };
  });
  box.querySelectorAll("[data-rm]").forEach((b) => {
    b.onclick = async (e) => {
      e.stopPropagation();
      await api(`/api/flows/${b.dataset.rm}`, { method: "DELETE" });
      refresh();
    };
  });
}

/* ------------------------------------------------------------------ events */

function drawEvents(events) {
  if (!events.length) return;
  const box = $("events");
  if (box.querySelector(".empty")) box.textContent = "";
  for (const e of events) {
    lastSeq = Math.max(lastSeq, e.seq);
    const detail = Object.entries(e)
      .filter(([k]) => !["seq", "kind", "t", "mono"].includes(k))
      .map(([k, v]) => `${k}=${Array.isArray(v) ? v.join("-") : v}`)
      .join("  ");
    const row = document.createElement("div");
    row.className = "ev";
    row.innerHTML = `<span class="k k-${e.kind}">${e.kind}</span><span class="d"></span>`;
    row.lastChild.textContent = detail;
    box.prepend(row);
  }
  while (box.children.length > 200) box.lastChild.remove();
}

/* ------------------------------------------------------------------- cycle */

async function refresh() {
  let state;
  try {
    state = await api("/api/state");
  } catch (err) {
    $("dot").className = "dot down";
    $("conn").textContent = "controller unreachable";
    return;
  }
  everConnected = true;
  const up = Object.values(state.switches).filter((s) => s.connected).length;
  const total = Object.keys(state.switches).length;
  $("dot").className = "dot " + (up === total ? "up" : "down");
  // Zero switches almost always means the lab was never deployed, or was torn
  // down by tools/validate_controller.py. Saying so beats reporting "0/6" and
  // leaving the reader to guess which half of the system is missing.
  $("conn").textContent = up === 0
    ? `no switches — is the lab deployed?  python -m netslice.topology deploy`
    : `${up}/${total} switches connected`;

  state.flowsById = Object.fromEntries(state.flows.map((f) => [f.flow_id, f]));
  if (selected && !state.flowsById[selected]) selected = null;
  drawMap(state);
  drawFlows(state);

  const feed = await api(`/api/events?since=${lastSeq}`);
  drawEvents(feed.events || []);
}

function showResult(reply) {
  const box = $("result");
  box.className = "result show " + (reply.ok ? "ok" : "err");
  if (!reply.ok) { box.textContent = reply.reason || "rejected"; return; }
  const f = reply.flow;
  box.innerHTML = `<b>${f.flow_id}</b> admitted: ${f.src}&rarr;${f.dst}
    ${f.bandwidth_mbps} Mbps via <b>${f.path.join("-")}</b>
    (bottleneck ${reply.bottleneck_mbps} Mbps)
    ${reply.preempted.length ? `<br>preempted: ${reply.preempted.join(", ")}` : ""}
    <code>${f.dst}: ${reply.iperf.server}</code>
    <code>${f.src}: ${reply.iperf.client}</code>`;
}

$("req").onsubmit = async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const body = {};
  for (const [k, v] of form.entries()) body[k] = v;
  // Unchecked boxes are absent from FormData, and absent means "use the
  // controller default", which is true. Send them explicitly.
  body.allow_preemption = $("req").allow_preemption.checked;
  body.admission_control = $("req").admission_control.checked;
  const reply = await api("/api/flows", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  showResult(reply);
  refresh();
};

$("clear").onclick = async () => {
  await api("/api/clear", { method: "POST" });
  selected = null;
  refresh();
};

(async function boot() {
  topo = await api("/api/topology");
  layout();
  const hosts = Object.keys(topo.hosts).sort();
  $("src").innerHTML = hosts.map((h) => `<option>${h}</option>`).join("");
  $("dst").innerHTML = hosts.map((h) => `<option>${h}</option>`).join("");
  $("dst").selectedIndex = Math.min(3, hosts.length - 1);
  await refresh();
  setInterval(refresh, 1000);
})();
</script>
</body>
</html>
